<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>HOME</title>
</head>
<body>

    <main>
        <h1> Praticando Java Script</h1>

    <section>
        <h2> Trocar nome na tela</h2>
        <input type="text" id="nome-entrada" placeholder="Informe seu nome">
        <button id="btn-troca">Trocar nome</button>
        <p> Olá <b id="nome-saida">Visitante</b>!</p>
    </section>
    <section>
        <h2>Alterando a cor da caixa</h2>
        <div id="caixa"> Aqui a caixa</div>
        <button id="btn_Violeta" class="btn">VIOLETA</button>
        <button id="btn_rosa" class="btn">ROSA</button>
        <button id="btn_turquesa" class="btn">TURQUESA</button>
    </section>

    <h2> Simulando adição e subtraçãoo de valor</h2>
    <section class="area_add_sub">
        <button id="btn_menos"> - </button>
        <p id="valor_real"> 0 </p>
        <button id="btn_mais"> + </button>
    </section>

    <h2> Adicionando Livros</h2>
    <section class="area-livros">

        <input type="text" id="nome_livro">
        <button id="adiciona_livro"> Adicionar</button>

        <ul id="lista_livros">
            
        </ul>
    </section>


    </main>

    <script src="home.js"></script>
</body>
</html>
