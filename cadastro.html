<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Área de Login</title>
</head>
<body>
    
</body>
</html>

    <main> 
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Connect<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>

            <form action="#" method="post" id="form-login">

                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Informe seu nome">

                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Informe seu email">

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Informe seu usuario">

                <label for="senha">Senha</label>
                <input type="text" id="senha" placeholder="Informe uma senha">

                <label for="confirme-senha">Confirme a senha</label>
                <input type="text" id="confirme-senha" placeholder="Confirme a senha">

                <button id="btn-acessar"> Cadastrar-se </button>
                <a href="login.html" id="possui-conta"> Já possuo uma conta. Acessar agora!</a>
            </form>
            </section>

            <section class="sessao-imagem">
                <img src="img/tela-login (1).png" alt="Casal numa Livraria">
            </section>
    </main>
    
</body>
</html>
